<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hint ladder</title>
<style>
  :root { --ink: #1d2433; --muted: #5c667a; --line: #dfe3ea; --bg: #f5f7fa; --card: #fff; --accent: #1f5fbf; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: var(--bg); }
  header { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 12px 20px; background: var(--card); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 18px; margin: 0 12px 0 0; }
  .pill { font-size: 12px; padding: 2px 10px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); color: var(--muted); }
  .pill.up { color: #1b7f3b; background: #e6f4ea; border-color: transparent; }
  .pill.down { color: #b3261e; background: #fce8e6; border-color: transparent; }
  main { max-width: 860px; margin: 0 auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 16px 20px; }
  h2 { font-size: 15px; margin: 0 0 10px; }
  .meta { color: var(--muted); font-size: 13px; }
  .text { white-space: pre-wrap; margin: 10px 0; }
  .opts { font-size: 14px; color: var(--muted); }
  select, button { font: inherit; }
  select { padding: 6px; border: 1px solid var(--line); border-radius: 6px; max-width: 100%; background: #fff; }
  .rungs { display: flex; flex-wrap: wrap; gap: 10px; }
  .rungs button { padding: 10px 14px; border: 1px solid var(--line); border-radius: 8px; background: #fff; cursor: pointer; text-align: left; color: var(--muted); font-size: 12px; }
  .rungs button:hover:not(:disabled) { border-color: var(--accent); }
  .rungs button:disabled { opacity: .45; cursor: default; }
  .rungs b { display: block; color: var(--ink); font-size: 14px; }
  .card { border: 1px dashed var(--line); border-radius: 6px; background: var(--bg); padding: 10px 12px; margin-top: 8px; }
  .card .rung-name { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .card .hint-text { margin: 6px 0; }
  .card .small { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .answer { font-weight: 700; }
  .kw { display: inline-block; background: #e8f0fe; color: var(--accent); border-radius: 999px; padding: 1px 10px; margin: 2px 4px 2px 0; font-size: 13px; }
  .err { color: #b3261e; }
  .hint2 { color: var(--muted); font-size: 13px; }

  /* ── NEW: Answer buttons & feedback ── */
  .answer-section { margin-top: 15px; border-top: 2px dashed var(--line); padding-top: 15px; }
  .answer-section h3 { font-size: 14px; margin: 0 0 10px; color: var(--muted); }
  .answer-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
  .answer-buttons button {
    flex: 1; min-width: 60px; padding: 12px; border: 2px solid var(--line);
    border-radius: 8px; background: #fff; cursor: pointer; font-size: 18px;
    font-weight: bold; color: var(--ink); transition: all 0.2s;
  }
  .answer-buttons button:hover:not(:disabled) { border-color: var(--accent); background: #e8f0fe; }
  .answer-buttons button:disabled { opacity: .45; cursor: default; }
  .answer-buttons button.selected { border-color: var(--accent); background: #e8f0fe; }

  .feedback { margin-top: 15px; padding: 15px; border-radius: 8px; font-weight: 500; display: none; }
  .feedback.ok { display: block; background: #e6f4ea; border: 1px solid #a5d6a7; color: #1b7f3b; }
  .feedback.x { display: block; background: #fce8e6; border: 1px solid #ef9a9a; color: #b3261e; }
  .feedback .led-indicator {
    display: inline-block; width: 32px; height: 32px; border-radius: 50%;
    margin-right: 10px; vertical-align: middle; font-size: 24px; text-align: center;
    line-height: 32px;
  }
  .feedback.ok .led-indicator { background: #4caf50; color: white; }
  .feedback.x .led-indicator { background: #f44336; color: white; }

  .stats-bar { display: flex; gap: 15px; font-size: 13px; color: var(--muted); margin-top: 10px; }
  .stats-bar strong { color: var(--ink); }
</style>
</head>
<body>
<header>
  <h1>Hint ladder</h1>
  <span id="s-llm" class="pill">language model</span>
  <span id="s-index" class="pill"></span>
</header>
<main>
  <!-- Problem section -->
  <section>
    <h2>Problem <select id="problems"></select></h2>
    <div class="meta" id="meta"></div>
    <div class="text" id="text"></div>
    <div class="opts" id="opts"></div>

    <!-- NEW: Answer buttons -->
    <div class="answer-section">
      <h3>Selecciona tu respuesta:</h3>
      <div class="answer-buttons" id="answer-buttons">
        <button data-letter="A">A</button>
        <button data-letter="B">B</button>
        <button data-letter="C">C</button>
        <button data-letter="D">D</button>
        <button data-letter="E">E</button>
      </div>
      <!-- NEW: Feedback area -->
      <div class="feedback" id="feedback"></div>
      <!-- NEW: Stats bar -->
      <div class="stats-bar" id="stats-bar"></div>
    </div>
  </section>

  <!-- Rungs section (existing) -->
  <section>
    <h2>Climb the ladder</h2>
    <div class="rungs">
      <button id="r1"><b>1 · Similar, easier</b>a solved problem from the index</button>
      <button id="r2"><b>2 · The topic</b>what the neighbours share, no model</button>
      <button id="r3"><b>3 · One hint</b>a model sentence, checked for leaks</button>
      <button id="r4"><b>4 · The solution</b>only if you really want it</button>
    </div>
    <div id="cards"></div>
  </section>
  <section class="hint2">Climb one rung at a time — each rung helps you think, it does not think for you. Keys: <b>1</b>–<b>4</b> rungs · <b>N</b> next problem · <b>A</b>–<b>E</b> answer.</section>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
let info, problems = [], current = null;

// ── NEW: Teaching stats ──
let correct_count = 0;
let total_attempts = 0;

async function api(path, body) {
  const r = await fetch(path, body ? {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)} : {});
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}

function renderRung(out) {
  const card = document.createElement("div");
  card.className = "card";
  let inner = "";
  if (out.error) {
    inner = `<div class="err">${esc(out.error)}</div>`;
  } else if (out.rung === 1) {
    const n = out.neighbour;
    inner = `<div>${esc(n.text)}</div>
      <div class="small">solved example ${esc(n.id)} · level ${n.level} · similarity ${out.score} ·
        ${out.relation === "easier" ? "one level easier than yours" : "same level as yours"}</div>`;
  } else if (out.rung === 2) {
    const chips = out.topic.map(([word, n, total]) => `<span class="kw">${esc(word)} ${n}/${total}</span>`).join("");
    inner = `<div>${chips}</div>
      <div class="small">the words the nearest solved problems share — the kind of problem you are in. Start by listing what changes and what stays the same.</div>`;
  } else if (out.rung === 3) {
    inner = `<div class="hint-text">${esc(out.hint)}</div>
      <div class="small">${out.source === "model"
        ? "from the model, and the code checked it: no answer inside"
        : `shown without the model${out.reason ? " — " + esc(out.reason) : ""}`}</div>`;
  } else if (out.rung === 4) {
    inner = `<div class="answer">The answer is ${esc(out.answer)}.</div>
      ${out.worked ? `<div class="small">worked example ${esc(out.worked.id)} (level ${out.worked.level}, its answer was ${esc(out.worked.label)}):</div>
      <div>${esc(out.worked.text)}</div>` : ""}`;
  }
  card.innerHTML = `<div class="rung-name">rung ${out.rung} · ${out.seconds} s</div>${inner}`;
  $("cards").prepend(card);
}

// ── NEW: Submit answer ──
async function submitAnswer(letter) {
  if (!current) return;
  const buttons = document.querySelectorAll("#answer-buttons button");
  buttons.forEach(b => b.disabled = true);

  try {
    const result = await api("/api/submit", {key: current.key, answer: letter});
    total_attempts++;

    const fb = $("feedback");
    if (result.correct) {
      correct_count++;
      fb.className = "feedback ok";
      fb.innerHTML = `<span class="led-indicator">✓</span> ${esc(result.message)}<br>
        <small>Correcto: ${result.answer}</small>`;
    } else {
      fb.className = "feedback x";
      fb.innerHTML = `<span class="led-indicator">✗</span> ${esc(result.message)}<br>
        <small>Tu respuesta: ${result.answer} · La correcta: ${result.label}</small>`;
    }

    // Update stats
    updateStats();

  } catch (e) {
    const fb = $("feedback");
    fb.className = "feedback x";
    fb.innerHTML = `<span class="led-indicator">✗</span> ${esc(e.message)}`;
  } finally {
    buttons.forEach(b => b.disabled = false);
  }
}

// ── NEW: Stats ──
function updateStats() {
  const acc = total_attempts > 0 ? Math.round((correct_count / total_attempts) * 100) : 0;
  $("stats-bar").innerHTML = `
    <span>Aciertos: <strong>${correct_count}</strong></span>
    <span>Total: <strong>${total_attempts}</strong></span>
    <span>Precisión: <strong>${acc}%</strong></span>
  `;
}

async function climb(n) {
  if (!current) return;
  if (n === 4 && !confirm("Rung 4 shows the answer. Do you want it now?")) return;
  const buttons = document.querySelectorAll(".rungs button");
  buttons.forEach(b => b.disabled = true);
  try {
    renderRung(await api("/api/rung", {key: current.key, rung: n}));
  } catch (e) {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `<div class="err">${esc(e.message)}</div>`;
    $("cards").prepend(card);
  } finally {
    buttons.forEach(b => b.disabled = false);
  }
}

async function open(key) {
  current = await api("/api/problem?key=" + encodeURIComponent(key));
  $("cards").innerHTML = "";
  $("meta").textContent = `${current.id} · ${current.language} · level ${current.level}`;
  $("text").textContent = current.text;
  const o = current.options || {};
  $("opts").innerHTML = Object.keys(o).length
    ? "ABCDE".split("").map(l => o[l] ? `<b>${l})</b> ${esc(o[l])} &nbsp; ` : "").join("")
    : "(the options are in the picture, which the ladder does not show)";

  // Reset answer buttons
  const buttons = document.querySelectorAll("#answer-buttons button");
  buttons.forEach(b => { b.disabled = false; b.classList.remove("selected"); });

  // Hide feedback
  $("feedback").className = "feedback";
  $("feedback").innerHTML = "";
}

async function main() {
  info = await api("/api/info");
  $("s-llm").textContent = "language model " + (info.llm ? "up" : "down");
  $("s-llm").className = "pill " + (info.llm ? "up" : "down");
  $("s-index").textContent = info.index ? `${info.index} problems in the index` : "no index yet (rungs 1–2 need it)";
  problems = await api("/api/problems");
  $("problems").innerHTML = problems.map(p =>
    `<option value="${esc(p.key)}">L${p.level} · ${esc(p.id)} · ${esc(p.language)}</option>`).join("");
  $("problems").addEventListener("change", e => open(e.target.value));

  // ── NEW: Answer button handlers ──
  document.querySelectorAll("#answer-buttons button").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll("#answer-buttons button").forEach(b => b.classList.remove("selected"));
      btn.classList.add("selected");
      submitAnswer(btn.dataset.letter);
    });
  });

  document.addEventListener("keydown", e => {
    if (e.target.tagName === "SELECT") return;
    if ("1234".includes(e.key)) climb(+e.key);
    else if ("ABCDE".includes(e.key.toUpperCase())) {
      const btn = document.querySelector(`#answer-buttons [data-letter="${e.key.toUpperCase()}"]`);
      if (btn) {
        document.querySelectorAll("#answer-buttons button").forEach(b => b.classList.remove("selected"));
        btn.classList.add("selected");
        submitAnswer(e.key.toUpperCase());
      }
    }
    else if (e.key.toLowerCase() === "n" && problems.length) {
      const i = problems.findIndex(p => current && p.key === current.key);
      open(problems[(i + 1) % problems.length].key);
    }
  });
  if (problems.length) open(problems[0].key);
}
main();
</script>
</body>
</html>
